name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: mesh2splat

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            archive_ext: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
            archive_ext: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            ext: ""
            archive_ext: tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail
          stage="mesh2splat-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.ext }}" "$stage/"
          cp README.md LICENSE "$stage/"
          cp -r assets "$stage/assets"
          7z a "${stage}.zip" "$stage"
          echo "ASSET=${stage}.zip" >> "$GITHUB_ENV"

      - name: Stage artifact (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          stage="mesh2splat-${{ matrix.target }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}${{ matrix.ext }}" "$stage/"
          cp README.md LICENSE "$stage/"
          cp -r assets "$stage/assets"
          tar -czf "${stage}.tar.gz" "$stage"
          echo "ASSET=${stage}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: ${{ env.ASSET }}

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release-files/ \;
          ls -la release-files

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          generate_release_notes: true
